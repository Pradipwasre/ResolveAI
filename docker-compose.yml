# Local stack: Postgres (pgvector), Redis, the API + dashboard, and the worker.
# Start:  docker compose up --build      then open http://localhost:8000

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://resolveai:resolveai@postgres:5432/resolveai
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      retries: 30

  worker:
    build: .
    command: ["scripts/start-worker.sh", "--poll"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://resolveai:resolveai@postgres:5432/resolveai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
